name: truesight_flutter
description: "Dart library for TrueSight projects"
version: 2407.5.1
homepage: https://github.com/thanhtunguet/truesight_flutter

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  bloc: ^8.1.4
  bloc_test: ^9.1.7
  cookie_jar: ^4.0.8
  dio: ^5.4.3+1
  dio_cookie_manager: ^3.1.1
  equatable: ^2.0.5
  firebase_core: ^3.1.1
  firebase_crashlytics: ^4.0.2
  firebase_messaging: ^15.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2
  fresh_dio: ^0.4.1
  go_router: ^14.2.0
  google_sign_in: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  infinite_scroll_pagination: ^4.0.0
  intl: ^0.19.0
  local_auth: ^2.2.0
  logging: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.3
  sentry_flutter: ^8.3.0
  sign_in_with_apple: ^6.1.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  carbon_icons:
    git: https://github.com/thanhtunguet/carbon-icons.git

